# 越南時間 11/16 00:05 起自動刪掉入境申報 QR code（qr.bin），再請 GitHub Pages 重新發布。
# 11/16–20 每 6 小時再檢查一次，萬一排程延誤或失敗會補刪；11/16 前手動執行也不會刪。
name: drop arrival QR
on:
  schedule:
    - cron: '5 17 15 11 *'
    - cron: '17 */6 16-20 11 *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: delete qr.bin after 2026-11-16 00:00 (UTC+7)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f qr.bin ]; then echo "qr.bin already gone"; exit 0; fi
          if [ "$(date -u +%s)" -lt "$(date -u -d 2026-11-15T17:00:00Z +%s)" ]; then echo "too early"; exit 0; fi
          git rm -q qr.bin
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '越南時間 11/16：刪掉入境申報 QR code'
          git push
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || echo 'pages build request failed (the push should still trigger a build)'
